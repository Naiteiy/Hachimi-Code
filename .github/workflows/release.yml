name: Release

# Publishing happens when you push a version tag, for example:
#
#   git tag v0.1.1-hachimi
#   git push origin v0.1.1-hachimi
#
# You can also run it by hand from the Actions tab, where you type the name of a
# tag that already exists. Each platform is built on a runner of that platform,
# so native dependencies (node-pty, watcher binaries) are correct for it, and
# every archive is attached to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a release
        required: true

permissions:
  # Needed to create the release and upload its assets.
  contents: write

jobs:
  build:
    strategy:
      # One failing platform must not hide the others' logs.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-latest
            target: darwin-arm64
          - runner: macos-26-intel
            target: darwin-x64
          - runner: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build the standalone binary
        # A tag push has no current branch, so the build cannot derive a channel
        # and would report a version like 0.0.0--202601010000. The script honours
        # this variable, so the released binary reports the tag instead.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        working-directory: packages/opencode
        run: HACHIMICODE_VERSION="${TAG#v}" bun run script/build.ts --single

      - name: Package it as a zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "packages/opencode/dist/hachimicode-${{ matrix.target }}/*" `
            -DestinationPath "hachimicode-${{ matrix.target }}.zip"

      - name: Package it as a tarball (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "hachimicode-${{ matrix.target }}.tar.gz" \
            -C "packages/opencode/dist/hachimicode-${{ matrix.target }}" .

      - uses: actions/upload-artifact@v5
        with:
          name: hachimicode-${{ matrix.target }}
          # A glob that matches nothing fails the step, which is what we want.
          path: |
            hachimicode-${{ matrix.target }}.tar.gz
            hachimicode-${{ matrix.target }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: download
          merge-multiple: true

      - name: Compute the tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: echo "name=${INPUT_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            download/*
